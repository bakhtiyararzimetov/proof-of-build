# Render Blueprint: backend (oracle + API). Dashboard → New → Blueprint → pick this repo.
# Secrets are not stored here: paste them in the dashboard (Environment → "Add from .env").
services:
  - type: web
    name: proof-of-build
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ORACLE_SECRET_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_ID_SALT
        sync: false
